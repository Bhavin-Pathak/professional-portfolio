name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Build 🔧
        run: |
          npm install --legacy-peer-deps
          npm run build
        env:
          CI: false
          DISABLE_ESLINT_PLUGIN: true
          REACT_APP_HF_API_KEY: ${{ secrets.REACT_APP_HF_API_KEY }}
          REACT_APP_GITHUB_REPOS_URL: ${{ secrets.REACT_APP_GITHUB_REPOS_URL }}
          REACT_APP_GITHUB_PROFILE_URL: ${{ secrets.REACT_APP_GITHUB_PROFILE_URL }}
          REACT_APP_LEETCODE_API_URL: ${{ secrets.REACT_APP_LEETCODE_API_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
